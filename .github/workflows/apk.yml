name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Gerar projeto Android (Capacitor)
        working-directory: mobile
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          npx cap sync android
      - name: Embutir endereço do servidor
        run: |
          URL="${{ vars.SERVER_URL }}"
          if [ -z "$URL" ] && [ -f mobile/server-url.txt ]; then URL=$(tr -d '[:space:]' < mobile/server-url.txt); fi
          [ -n "$URL" ] && sed -i "s#__SERVER_URL__#$URL#" mobile/www/index.html || true
          cd mobile && npx cap sync android
      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AIsConnect-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publicar release com o APK
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AIsConnect.apk
          gh release create "apk-${{ github.run_number }}" AIsConnect.apk --title "AIsConnect APK #${{ github.run_number }}" --notes "APK de teste (assinatura de debug). Instale permitindo fontes desconhecidas."
