<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIsConnect</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#0a1318;color:#e6eef1;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
.c{width:min(420px,100%);background:#101d24;border-radius:20px;padding:26px}h1{margin:0 0 6px}p{color:#8ea1ab;margin:0 0 16px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #1f323b;background:#15262e;color:inherit;font:inherit}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#3cc3cc;color:#04262a;font:700 16px system-ui}small{display:block;margin-top:12px;color:#8ea1ab}</style></head>
<body><div class="c"><h1>AIsConnect</h1><p>Informe o endereço do seu servidor AIsConnect.</p>
<input id="u" placeholder="http://192.168.0.10:3000" inputmode="url" autocapitalize="off" autocorrect="off"><button id="go">Conectar</button>
<small>Use o endereço do computador onde o servidor está rodando (ou o domínio HTTPS dele). Chamadas de voz e vídeo exigem HTTPS.</small></div>
<script>
var k='ais_server',u=document.getElementById('u');try{u.value=localStorage.getItem(k)||''}catch(e){}
function go(){var v=u.value.trim();if(!v)return;if(!/^https?:\/\//.test(v))v='http://'+v;try{localStorage.setItem(k,v)}catch(e){}location.href=v}
document.getElementById('go').onclick=go;u.onkeydown=function(e){if(e.key==='Enter')go()};
if(u.value&&!location.hash)setTimeout(go,400);
</script></body></html>
